<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>機構設計審查系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#F3F5F8;
    --panel:#FFFFFF;
    --panel-2:#F7F8FA;
    --paper:#1F2933;
    --paper-dim:#667385;
    --line:#D5DBE3;
    --steel:#1F4E8C;
    --steel-dim:#173E70;
    --amber:#B7791F;
    --green:#2F7D4F;
    --rust:#B83232;
    --violet:#1F4E8C;
    --pink:#B83232;
    --sky:#1F4E8C;
    --radius:6px;
    --header-bg:#1F3A5F;
    --header-fg:#FFFFFF;
    --accent-soft:#EEF3F9;
    --accent-ring:rgba(31,78,140,0.14);
  }
  /* ---- 配色主題（由「更多」選單切換）---- */
  :root[data-theme="light"]{
    --header-bg:#F7F8FA; --header-fg:#1F2933;
  }
  :root[data-theme="graphite"]{
    --ink:#F2F3F5; --steel:#374151; --steel-dim:#1F2937;
    --header-bg:#2B3440; --accent-soft:#EEF0F3; --accent-ring:rgba(55,65,81,0.18);
  }
  :root[data-theme="teal"]{
    --ink:#F1F6F6; --steel:#0F766E; --steel-dim:#0B5C56;
    --header-bg:#134E4A; --accent-soft:#E8F5F3; --accent-ring:rgba(15,118,110,0.16);
  }
  :root[data-theme="forest"]{
    --ink:#F2F6F3; --steel:#2E6B4A; --steel-dim:#235239;
    --header-bg:#1F4A33; --accent-soft:#EAF4EE; --accent-ring:rgba(46,107,74,0.16);
  }
  :root[data-theme="bronze"]{
    --ink:#F6F4F0; --steel:#7A5C2E; --steel-dim:#5F4721;
    --header-bg:#4A3B28; --accent-soft:#F6F1E8; --accent-ring:rgba(122,92,46,0.18);
  }
  .swatch{ display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:8px; vertical-align:-1px; border:1px solid rgba(0,0,0,0.15); }
  .menu .menu-label{ font-size:11px; font-weight:600; color:var(--paper-dim); padding:6px 12px 2px; }

  * { box-sizing: border-box; }
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:1040px;
    margin:0 auto;
    padding:24px 24px 64px;
  }
  h1,h2{ font-family:inherit; }

  /* ---- Header / document info ---- */
  .titleblock{
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:16px;
    background:var(--panel);
  }
  .titleblock-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px;
    background:var(--header-bg);
    color:var(--header-fg);
    border-bottom:1px solid var(--line);
  }
  .titleblock-top h1{
    font-size:18px;
    font-weight:600;
    margin:0;
    letter-spacing:0.02em;
    color:var(--header-fg);
  }
  .titleblock-top .tag{
    font-weight:600;
    font-size:12px;
    color:var(--header-fg);
    border:1px solid currentColor;
    opacity:0.85;
    padding:3px 10px;
    border-radius:3px;
    letter-spacing:0.04em;
  }
  .tb-grid{
    display:grid;
    grid-template-columns:2fr 1.9fr 1.2fr 1.2fr 0.8fr;
    background:var(--panel);
  }
  .tb-cell{
    padding:10px 16px;
    border-right:1px solid var(--line);
    background:var(--panel);
  }
  .tb-cell:last-child{ border-right:none; }
  .tb-cell label{
    display:block;
    font-size:11px;
    color:var(--paper-dim);
    margin-bottom:3px;
    font-weight:600;
  }
  .tb-cell input,.tb-cell select{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid transparent;
    color:var(--paper);
    font-family:inherit;
    font-weight:500;
    font-size:14px;
    padding:2px 0;
    outline:none;
  }
  .tb-cell input:hover,.tb-cell select:hover{ border-bottom-color:var(--line); }
  .tb-cell input:focus,.tb-cell select:focus{ border-bottom-color:var(--steel); }
  .tb-cell select option{ background:var(--panel); color:var(--paper); }

  /* ---- Toolbar ---- */
  select.review-select{
    background:var(--panel);
    border:1px solid #C3CBD6;
    color:var(--paper);
    padding:7px 10px;
    border-radius:4px;
    font-family:inherit;
    font-weight:500;
    font-size:13px;
    min-width:240px;
  }
  button{
    font-family:inherit;
    font-weight:500;
    font-size:13px;
    cursor:pointer;
    border-radius:4px;
    border:1px solid #C3CBD6;
    background:var(--panel);
    color:var(--paper);
    padding:7px 14px;
    transition:background .12s, border-color .12s;
  }
  button:hover{ background:#EEF1F5; border-color:#A9B4C2; }
  button.primary{ background:var(--steel); border-color:var(--steel); color:#fff; }
  button.primary:hover{ background:var(--steel-dim); border-color:var(--steel-dim); }
  button.unlocked{ background:#FFF4DB; border-color:#D9A441; color:#8A5A00; }
  button.unlocked:hover{ background:#FFEBC2; border-color:#C58F2C; }
  button.danger-ghost{ color:var(--rust); border-color:transparent; padding:7px 10px; background:transparent; }
  button.danger-ghost:hover{ background:rgba(184,50,50,0.08); border-color:transparent; }
  button.small{ padding:4px 10px; font-size:12px; }

  /* ---- Summary ---- */

  .overall-bar{
    height:8px;
    background:#E1E6ED;
    border-radius:4px;
    overflow:hidden;
    margin-bottom:16px;
    display:flex;
  }
  .overall-bar div{ height:100%; transition:width .3s ease; }


  /* ---- Categories ---- */
  .category{
    border:1px solid var(--line);
    border-radius:var(--radius);
    margin-bottom:12px;
    overflow:hidden;
    background:var(--panel);
  }
  .category-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    padding:10px 16px;
    background:var(--panel-2);
    cursor:pointer;
    user-select:none;
    transition:background .12s;
  }
  .category:not(.collapsed) .category-head{ border-bottom:1px solid var(--line); }
  .category-head:hover{ background:#EEF1F5; }
  .category-head-left{ display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
  .category-head h2{ font-size:14px; font-weight:600; margin:0; }
  .cat-icon-num{
    font-size:14px;
    font-weight:600;
    color:var(--paper-dim);
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .cat-name-input{
    flex:1;
    min-width:40px;
    background:transparent;
    border:none;
    border-bottom:1px solid transparent;
    color:var(--paper);
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    padding:2px 4px;
    outline:none;
    cursor:text;
    border-radius:3px;
    transition:background .12s, border-color .12s;
  }
  .cat-name-input:hover{ background:var(--panel); border-bottom-color:var(--line); }
  .cat-name-input:focus{ background:var(--panel); border-bottom-color:var(--steel); }
  .reorder-btn{ padding:4px 8px; font-size:10px; line-height:1; }
  .cat-progress{
    font-weight:500;
    font-size:12px;
    color:var(--paper-dim);
    font-variant-numeric:tabular-nums;
  }
  .cat-bar{
    width:64px;height:6px;background:#E1E6ED;border-radius:3px;overflow:hidden;
  }
  .cat-bar div{ height:100%; transition:width .3s ease; }
  .chevron{
    color:var(--paper-dim);
    transition:transform .15s;
    font-size:12px;
  }
  .category.collapsed .chevron{ transform:rotate(-90deg); }
  .category-body{ padding:0 0 12px; background:var(--panel); }
  .category.collapsed .category-body{ display:none; }

  /* ---- Items ---- */
  .item-row{
    padding:12px 16px 14px;
    border-top:1px solid #E6EAF0;
  }
  .item-row:first-child{ border-top:none; }
  .item-top{ display:flex; gap:10px; align-items:flex-start; }
  .item-num{
    font-weight:600;
    font-size:12px;
    color:var(--paper-dim);
    min-width:34px;
    padding-top:8px;
    flex-shrink:0;
    font-variant-numeric:tabular-nums;
  }
  .item-main{ flex:1; min-width:0; }
  .item-reorder{
    display:flex;
    flex-direction:column;
    flex-shrink:0;
    margin-top:2px;
    border:1px solid var(--line);
    border-radius:4px;
    overflow:hidden;
  }
  .item-reorder-btn{
    all:unset;
    cursor:pointer;
    font-size:9px;
    line-height:1;
    color:var(--paper-dim);
    padding:3px 7px;
    text-align:center;
    transition:background .12s, color .12s;
  }
  .item-reorder-btn:hover{ background:#EEF1F5; color:var(--steel); }
  .item-reorder-btn:first-child{ border-bottom:1px solid var(--line); }
  .item-text{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px dashed transparent;
    color:var(--paper);
    font-size:14px;
    font-family:inherit;
    font-weight:600;
    resize:none;
    line-height:1.5;
    padding:5px 4px;
    outline:none;
    cursor:text;
    border-radius:3px;
    transition:background .12s, border-color .12s;
  }
  .item-text:hover{ background:var(--panel-2); border-bottom-color:var(--line); }
  .item-text:focus{ background:var(--panel-2); border-bottom-color:var(--steel); }
  .item-meta{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:4px;
  }
  .item-meta .field label{
    display:block;
    font-size:11px;
    color:var(--paper-dim);
    margin-bottom:3px;
    font-weight:600;
  }
  .item-meta input, .meta-textarea{
    width:100%;
    background:var(--panel);
    border:1px solid #C9D1DB;
    border-radius:4px;
    color:var(--paper);
    font-size:13px;
    padding:6px 9px;
    font-family:inherit;
    outline:none;
  }
  .meta-textarea{
    resize:none;
    line-height:1.5;
    overflow:hidden;
    display:block;
  }
  .item-meta input:focus, .meta-textarea:focus{ border-color:var(--steel); box-shadow:0 0 0 2px var(--accent-ring); }

  .status-btn{
    font-weight:500;
    font-size:12px;
    padding:4px 14px;
    border-radius:4px;
    border:1px solid #C9D1DB;
    background:var(--panel);
    color:var(--paper-dim);
  }
  .status-btn.active[data-s="pending"]{ background:#FFF4DB; border-color:#D9A441; color:#8A5A00; font-weight:600; }
  .status-btn.active[data-s="pass"]{ background:#E4F3EA; border-color:#5FA67C; color:#1E6B43; font-weight:600; }
  .status-btn.active[data-s="fail"]{ background:#FBE6E6; border-color:#D77A7A; color:#9B2323; font-weight:600; }
  .status-btn.active[data-s="na"]{ background:#EDEFF2; border-color:#A6AFBB; color:#4B5563; font-weight:600; }
  .move-select{
    font-family:inherit;
    font-weight:500;
    font-size:12px;
    padding:4px 8px;
    border-radius:4px;
    border:1px solid #C9D1DB;
    background:var(--panel);
    color:var(--paper-dim);
    max-width:160px;
  }
  .move-select:hover{ border-color:var(--steel); color:var(--paper); }
  .add-item-btn{ margin:10px 16px 0; }

  /* ---- Bulk edit table ---- */
  .bulk-table{
    overflow-x:auto;
    padding:0 0 4px;
  }
  .bulk-row{
    display:grid;
    grid-template-columns:44px 2fr 1.3fr 1.3fr 110px 130px 70px;
    gap:8px;
    align-items:center;
    padding:6px 12px;
    border-bottom:1px solid #E6EAF0;
    min-width:900px;
  }
  .bulk-row.bulk-header{
    font-size:12px;
    font-weight:600;
    color:var(--paper-dim);
    background:var(--panel-2);
    border-bottom:1px solid var(--line);
  }
  .bulk-cell.bulk-num{ font-weight:600; font-size:12px; color:var(--paper-dim); text-align:left; font-variant-numeric:tabular-nums; }
  .bulk-input{
    width:100%;
    background:var(--panel);
    border:1px solid #C9D1DB;
    border-radius:4px;
    color:var(--paper);
    font-size:13px;
    padding:5px 8px;
    font-family:inherit;
    outline:none;
  }
  .bulk-input:focus{ border-color:var(--steel); box-shadow:0 0 0 2px var(--accent-ring); }
  .bulk-textarea{ resize:vertical; min-height:30px; line-height:1.4; }
  .bulk-status-select{
    width:100%;
    background:var(--panel);
    border:1px solid #C9D1DB;
    border-radius:4px;
    color:var(--paper);
    font-size:12px;
    font-weight:500;
    padding:5px 4px;
    font-family:inherit;
    outline:none;
  }
  .bulk-cell.bulk-del{ display:flex; justify-content:center; align-items:center; gap:4px; }
  .bulk-cell.bulk-del button.danger-ghost{ padding:3px 8px; }

  /* ---- Mode toggle ---- */

  /* ---- Brainstorm (fishbone) ---- */
  .brainstorm-hint{
    font-size:13px;
    color:var(--paper);
    margin-bottom:16px;
    line-height:1.7;
    background:var(--accent-soft);
    border-left:3px solid var(--steel);
    padding:10px 16px;
    border-radius:4px;
  }
  .bone-card{
    border:1px solid var(--line);
    border-radius:var(--radius);
    margin-bottom:12px;
    background:var(--panel);
    overflow:hidden;
  }
  .bone-head{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 16px;
    border-bottom:1px solid var(--line);
    background:var(--panel-2);
  }
  .bone-head .bone-num{
    font-weight:600;
    font-size:12px;
    color:var(--paper-dim);
    min-width:16px;
  }
  .bone-name-input{
    flex:1;
    background:transparent;
    border:none;
    color:var(--paper);
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    outline:none;
  }
  .bone-body{ padding:12px 16px 14px; }
  .point-row{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .point-dash{ color:var(--paper-dim); font-size:13px; }
  .point-input{
    flex:1;
    background:var(--panel);
    border:1px solid #C9D1DB;
    border-radius:4px;
    color:var(--paper);
    font-size:13px;
    padding:6px 10px;
    font-family:inherit;
    outline:none;
  }
  .point-input:focus{ border-color:var(--steel); box-shadow:0 0 0 2px var(--accent-ring); }
  .add-point-btn{ margin-top:2px; }
  .add-bone-row{ margin:6px 0 24px; }
  .convert-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 0 8px;
    border-top:1px solid var(--line);
    margin-top:8px;
    flex-wrap:wrap;
  }
  .convert-note{ font-size:12px; color:var(--paper-dim); }

  /* ---- Panel (reused for "新增分類") ---- */
  .signoff{
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 18px 16px;
    background:var(--panel);
  }
  .signoff h2{ font-size:14px; font-weight:600; margin:0 0 10px; }

  .save-indicator{
    position:fixed;
    bottom:18px;
    right:18px;
    font-weight:500;
    font-size:12px;
    color:#fff;
    background:#1F2933;
    padding:7px 14px;
    border-radius:4px;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
    opacity:0;
    transform:translateY(6px);
    transition:opacity .25s, transform .25s;
    z-index:10001;
  }
  .save-indicator.show{ opacity:1; transform:translateY(0); }
  .save-indicator.error{ background:var(--rust); }

  .storage-warning{
    background:#FFF4DB;
    border:1px solid #D9A441;
    border-radius:var(--radius);
    padding:12px 16px;
    margin-bottom:16px;
    font-size:13px;
    line-height:1.7;
    color:var(--paper);
  }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--paper-dim); }
  .empty-state p{ margin:6px 0; font-size:13px; }

  /* ---- Images ---- */
  .item-images{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .item-image-thumb{
    position:relative;
    width:84px; height:84px;
    border-radius:4px;
    overflow:hidden;
    border:1px solid #C9D1DB;
    cursor:zoom-in;
    flex-shrink:0;
    background:var(--panel-2);
  }
  .item-image-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .item-image-remove{
    position:absolute;
    top:3px; right:3px;
    width:20px; height:20px;
    border-radius:3px;
    background:rgba(31,41,51,0.78);
    border:none;
    color:#fff;
    font-size:13px;
    font-weight:600;
    display:flex; align-items:center; justify-content:center;
    padding:0;
    cursor:pointer;
    line-height:1;
  }
  .item-image-remove:hover{ background:var(--rust); border:none; }
  .item-image-add{
    width:84px; height:84px;
    border-radius:4px;
    border:1px dashed #A9B4C2;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    color:var(--paper-dim);
    font-size:12px;
    text-align:center;
    line-height:1.4;
    background:var(--panel-2);
    flex-shrink:0;
    transition:background .12s, border-color .12s, color .12s;
  }
  .item-image-add:hover{ background:var(--accent-soft); border-color:var(--steel); color:var(--steel); }

  .lightbox{
    position:fixed; inset:0;
    background:rgba(15,23,32,0.9);
    display:none;
    z-index:9999;
    padding:12px;
    overflow:auto;
    cursor:zoom-out;
  }
  .lightbox.show{ display:flex; }
  .lightbox img{
    width:96vw; height:90vh;
    object-fit:contain;
    margin:auto;
    flex-shrink:0;
    border-radius:4px;
    background:#fff;
    cursor:zoom-in;
  }
  .lightbox img.zoomed{
    width:auto; height:auto;
    min-width:150vw;
    max-width:none; max-height:none;
    object-fit:initial;
    cursor:zoom-out;
  }
  .lightbox-close{
    position:fixed; top:12px; right:16px;
    width:36px; height:36px; padding:0;
    border-radius:4px;
    background:rgba(255,255,255,0.92);
    color:var(--paper);
    font-size:20px; line-height:1;
    z-index:10000;
  }

  ::placeholder{ color:#9AA5B3; }

  input:disabled, textarea:disabled, select:disabled{
    background:var(--ink) !important;
    color:var(--paper-dim) !important;
    cursor:not-allowed;
    border-color:var(--line) !important;
  }
  .tb-cell input:disabled, .tb-cell select:disabled{ background:transparent !important; border-color:transparent !important; }
  .cat-name-input:disabled{ background:transparent !important; border-color:transparent !important; color:var(--paper) !important; }
  .item-text:disabled, .item-text:disabled:hover{ background:transparent !important; border-color:transparent !important; color:var(--paper) !important; cursor:default; }


  /* ---- Tabs ---- */
  .tabs-wrap{
    display:flex;
    align-items:flex-end;
    gap:10px;
    margin-bottom:12px;
    border-bottom:1px solid var(--line);
  }
  .tabs{ display:flex; gap:2px; flex:1; overflow-x:auto; overflow-y:hidden; padding-top:2px; scrollbar-width:thin; }
  .tabs::-webkit-scrollbar{ height:6px; }
  .tabs::-webkit-scrollbar-thumb{ background:#C3CBD6; border-radius:3px; }
  .tab{
    flex-shrink:0;
    max-width:220px;
    display:inline-flex;
    align-items:center;
    white-space:nowrap;
    border:1px solid var(--line);
    border-bottom:none;
    border-radius:6px 6px 0 0;
    background:#E7EBF0;
    color:var(--paper-dim);
    padding:7px 16px;
    margin-bottom:-1px;
    font-size:13px;
    font-weight:500;
  }
  .tab:hover{ background:#EEF1F5; color:var(--paper); border-color:var(--line); }
  .tab.active{
    background:var(--panel);
    color:var(--paper);
    font-weight:600;
    border-top:2px solid var(--steel);
    padding-top:6px;
  }
  .tab-label{ overflow:hidden; text-overflow:ellipsis; }
  .tab-close{ margin-left:8px; padding:0 4px; font-size:15px; line-height:1.2; border-radius:3px; opacity:0; }
  .tab:hover .tab-close, .tab.active .tab-close{ opacity:0.5; }
  .tab .tab-close:hover{ opacity:1; color:var(--rust); background:rgba(184,50,50,0.1); }
  .tab-edit{ margin-left:8px; flex-shrink:0; font-size:11px; opacity:0.45; }

<script>
const STATUS = ['pending','pass','fail','na'];
const STATUS_LABEL = {pending:'待審',pass:'通過',fail:'未通過',na:'不適用'};
const CAT_COLORS = ['#1F4E8C'];
const CAT_ICONS = [''];

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

const LOCAL_PREFIX = 'drc:';
function hasClaudeStorage(){
  return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.set === 'function';
}
const storageAdapter = {
  async get(key, shared){
    if(hasClaudeStorage()){
      try{ return await window.storage.get(key, shared); }catch(e){ /* fall through to localStorage */ }
    }
    const raw = localStorage.getItem(LOCAL_PREFIX+key);
    if(raw === null) throw new Error('not found: '+key);
    return {key, value: raw, shared: !!shared};
  },
  async set(key, value, shared){
    if(hasClaudeStorage()){
      try{ return await window.storage.set(key, value, shared); }catch(e){ /* fall through to localStorage */ }
    }
    localStorage.setItem(LOCAL_PREFIX+key, value);
    return {key, value, shared: !!shared};
  },
  async delete(key, shared){
    if(hasClaudeStorage()){
      try{ return await window.storage.delete(key, shared); }catch(e){ /* fall through to localStorage */ }
    }
    localStorage.removeItem(LOCAL_PREFIX+key);
    return {key, deleted:true, shared: !!shared};
  },
  async list(prefix, shared){
    if(hasClaudeStorage()){
      try{ return await window.storage.list(prefix, shared); }catch(e){ /* fall through to localStorage */ }
    }
    const keys = [];
    const p = LOCAL_PREFIX + (prefix||'');
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(p)===0) keys.push(k.slice(LOCAL_PREFIX.length));
    }
    return {keys, prefix, shared: !!shared};
  }
};

function defaultCategories(){

    {id: uid('cat'), name:'功能性', items:[

      {id:uid('it'), text:'材料選用符合使用環境（溫度／腐蝕／化學相容性）', criteria:'材料規格與環境條件比對通過', evidence:'', owner:'', status:'pending'}

      {id:uid('it'), text:'可製造性（DFM）審查已完成', criteria:'無需特殊夾具／工序，或已提出對應方案', evidence:'', owner:'', status:'pending'},
      {id:uid('it'), text:'組裝順序與工具可及性已確認', criteria:'組裝路徑模擬無死角，工具可進入', evidence:'', owner:'', status:'pending'}
    ]},
    {id: uid('cat'), name:'可靠性與驗證', items:[
      {id:uid('it'), text:'失效模式已透過DFMEA盤點且高風險項有對策', criteria:'高風險項目均有對應設計改善或驗證計畫', evidence:'', owner:'', status:'pending'},
      {id:uid('it'), text:'對應測試計畫已建立並涵蓋所有關鍵失效模式', criteria:'測試矩陣與DFMEA項目可追溯對應', evidence:'', owner:'', status:'pending'},
      {id:uid('it'), text:'過去同類產品Lessons Learned已檢視並納入設計考量', criteria:'逐條檢視歷史問題清單並記錄結論', evidence:'', owner:'', status:'pending'}
    ]}
  ];
}

function defaultReview(name){
  const today = new Date().toISOString().slice(0,10);
  return {
    name: name || '新審查項目',
    phase: 'mockup_release',
    reviewer: '',
    date: today,
    revision: 'A',
    signoffName:'',
    signoffDate:'',
    signoffDone:false,
    categories: defaultCategories(),
    brainstorm: []
  };
}

let state = {
  reviewsList: [],
  activeId: null,
  activeReview: null,
  loaded:false,
  viewMode: 'checklist',
  storageOK: true,
  hasPassword: true,
  passwordHash: null,
  editUnlocked: false,
  filterStatus: 'all',
  searchText: '',
  menuOpen: false,
  theme: 'navy',
  issueOpen: {},
  focusIssueId: null
};

let saveTimer = null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ saveActiveReview(); }, 600);
}

function simpleHash(str){
  let hash = 5381;
  for(let i=0;i<str.length;i++){
    hash = ((hash << 5) + hash) + str.charCodeAt(i);
    hash = hash & hash;
  }
  return String(hash);
}

// ---- 鎖定密碼（固定密碼，有效期限制）----
const THEMES = [
  ['navy','深藍（預設）','#1F3A5F'],
  ['light','淺色表頭','#F7F8FA'],
  ['graphite','石墨灰','#2B3440'],
  ['teal','青藍綠','#134E4A'],
  ['forest','森林綠','#1F4A33'],
  ['bronze','暖棕','#4A3B28']
];
function applyTheme(key){
  const valid = THEMES.some(t=>t[0]===key);
  const k = valid ? key : 'navy';
  if(k === 'navy') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', k);
  state.theme = k;
}
async function setTheme(key){
  applyTheme(key);
  try{ await storageAdapter.set('app:theme', key, false); }catch(e){ /* ignore */ }
}

const LOCK_PASSWORD_HASH = '217406711';
const LOCK_EXPIRY_LABEL = '2027/6/30';
const LOCK_EXPIRY = new Date(2027, 5, 30, 23, 59, 59, 999);

function normalizePassword(str){
  return String(str).replace(/[\s\u3000]+/g,'').toUpperCase();
}
function isPasswordExpired(){
  return new Date() > LOCK_EXPIRY;
}

async function handleLockToggle(){
  if(state.editUnlocked){
    state.editUnlocked = false;
    state.viewMode = 'checklist';
    render();
    return;
  }
  if(isPasswordExpired()){
    alert('此密碼已於 '+LOCK_EXPIRY_LABEL+' 到期，無法解鎖。\n請向管理者取得新版本。');
    return;
  }
  const pw = prompt('輸入密碼以解鎖編輯：\n（密碼有效期至 '+LOCK_EXPIRY_LABEL+'）');
  if(pw===null) return;
  if(simpleHash(normalizePassword(pw)) === LOCK_PASSWORD_HASH){
    state.editUnlocked = true;
    render();
  } else {
    alert('密碼錯誤。');
  }
}

function showSaved(ok, msg){
  const el = document.getElementById('saveIndicator');
  el.textContent = ok===false ? (msg || '儲存失敗') : '已儲存';
  el.classList.remove('error');
  if(ok===false) el.classList.add('error');
  el.classList.add('show');
  clearTimeout(showSaved._t);
  showSaved._t = setTimeout(()=>el.classList.remove('show'), ok===false ? 4000 : 900);
}

async function saveMeta(){
  try{
    await storageAdapter.set('meta:reviews', JSON.stringify(state.reviewsList), false);
  }catch(e){
    console.error('save meta failed', e);
    showSaved(false, '儲存失敗，請改用「匯出備份」保存資料');
    state.storageOK = false;
  }
}

async function saveActiveReview(){
  if(!state.activeId) return;
  try{
    await storageAdapter.set('review:'+state.activeId, JSON.stringify(state.activeReview), false);
    await storageAdapter.set('active-review', state.activeId, false);
    showSaved(true);
  }catch(e){
    console.error('save review failed', e);
    showSaved(false, '儲存失敗，請改用「匯出備份」保存資料');
    state.storageOK = false;
  }
}

async function loadAll(){
  try{
    const testKey = '__storage_check__';
    await storageAdapter.set(testKey, '1', false);
    await storageAdapter.get(testKey, false);
    await storageAdapter.delete(testKey, false);
    state.storageOK = true;
  }catch(e){
    console.error('storage check failed', e);
    state.storageOK = false;
  }

  state.hasPassword = true;
  state.editUnlocked = false;
  try{
    const th = await storageAdapter.get('app:theme', false);
    applyTheme(th.value);
  }catch(e){ applyTheme('navy'); }

  try{
    const metaRes = await storageAdapter.get('meta:reviews', false);
    state.reviewsList = metaRes ? JSON.parse(metaRes.value) : [];
  }catch(e){
    state.reviewsList = [];
  }
  let activeId = null;
  try{
    const a = await storageAdapter.get('active-review', false);
    activeId = a ? a.value : null;
  }catch(e){}

  await syncMetaReviewers();

  if(state.reviewsList.length === 0){
    await createNewReview('概念設計審查 - 範例');
    return;
  }

  if(!activeId || !state.reviewsList.find(r=>r.id===activeId)){
    activeId = state.reviewsList[0].id;
  }
  await loadReview(activeId);
}

async function loadReview(id){
  try{
    const res = await storageAdapter.get('review:'+id, false);
    if(res){
      state.activeReview = JSON.parse(res.value);
      if(!Array.isArray(state.activeReview.brainstorm)) state.activeReview.brainstorm = [];
      state.activeId = id;
      let changed = false;
      if(!state.activeReview._templatesChecked){
        changed = ensureTemplateCategories(state.activeReview);
      }
      if(await migrateReviewImages(state.activeReview)) changed = true;
      await storageAdapter.set('active-review', id, false);
      render();
      if(changed) await saveActiveReview();
      return;
    }
  }catch(e){ console.error('load review failed', e); }
  state.activeReview = defaultReview();
  ensureTemplateCategories(state.activeReview);
  state.activeId = id;
  render();
}

async function createNewReview(name){
  const id = uid('rev');
  const review = defaultReview(name || ('新審查項目'));
  ensureTemplateCategories(review);
  state.reviewsList.push({id, name: review.name, reviewer: review.reviewer || ''});
  state.activeId = id;
  state.activeReview = review;
  await saveMeta();
  await saveActiveReview();
  render();
}

function tabLabel(item){
  return ((item.reviewer && item.reviewer.trim()) || item.name || '未命名');
}

async function syncMetaReviewers(){
  let changed = false;
  for(const m of state.reviewsList){
    if(typeof m.reviewer === 'undefined'){
      try{
        const rr = await storageAdapter.get('review:' + m.id, false);
        m.reviewer = (JSON.parse(rr.value).reviewer) || '';
      }catch(e){ m.reviewer = ''; }
      changed = true;
    }
  }
  if(changed) await saveMeta();
}

function startTabRename(btn, item){
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'tab-input';
  input.value = item.reviewer || '';
  input.placeholder = '審查人姓名';
  btn.replaceWith(input);
  input.focus();
  input.select();
  let done = false;
  const commit = (save)=>{
    if(done) return;
    done = true;
    const v = input.value.trim();
    if(save && v && v !== item.reviewer){
      item.reviewer = v;
      if(state.activeReview && item.id === state.activeId) state.activeReview.reviewer = v;
      saveMeta();
      saveActiveReview();
    }
    render();
  };
  input.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){ e.preventDefault(); commit(true); }
    else if(e.key === 'Escape'){ commit(false); }
  });
  input.addEventListener('blur', ()=>commit(true));
  input.addEventListener('click', (e)=>e.stopPropagation());
}

async function duplicateReview(){
  const src = state.activeReview;
  if(!src) return;
  const defName = (src.reviewer || src.name || '審查') + ' (複本)';
  const nameInput = prompt('新分頁的審查人姓名：', defName);
  if(nameInput === null) return;
  const nm = nameInput.trim() || defName;
  const fresh = confirm('要讓新分頁重新填寫嗎？\n\n按「確定」：狀態改回「待審」、備註與 Issue 清空（其他內容與圖片完整複製）\n按「取消」：連同目前的狀態與備註一起完整複製');
  clearTimeout(saveTimer);
  await saveActiveReview();
  const copy = JSON.parse(JSON.stringify(src));
  for(const c of (copy.categories || [])){
    for(const it of (c.items || [])){
      if(fresh){ it.issue = ''; it.issueImages = []; }
      for(const field of IMAGE_FIELDS){
        if(!Array.isArray(it[field])) continue;
        const out = [];
        for(const ref of it[field]){
          if(isIdbRef(ref)){
            try{
              const blob = await idbGet(ref.slice(4));
              if(blob){
                const nid = uid('img');
                await idbPut(nid, blob);
                out.push('idb:' + nid);
              }
            }catch(e){ console.warn('copy image failed', e); }
          } else out.push(ref);
        }
        it[field] = out;
      }
      if(fresh){ it.status = 'pending'; it.evidence = ''; }
      delete it._focus;
    }
  }
  copy.reviewer = nm;
  copy.date = new Date().toISOString().slice(0,10);
  const id = uid('rev');
  state.reviewsList.push({id, name: copy.name, reviewer: nm});
  state.activeId = id;
  state.activeReview = copy;
  await saveMeta();
  await saveActiveReview();
  render();
}

function verifyPasswordOnce(){
  if(isPasswordExpired()){
    alert('此密碼已於 '+LOCK_EXPIRY_LABEL+' 到期，無法執行此操作。\n請向管理者取得新版本。');
    return false;
  }
  const pw = prompt('此操作需要輸入密碼：');
  if(pw === null) return false;
  if(simpleHash(normalizePassword(pw)) === LOCK_PASSWORD_HASH) return true;
  alert('密碼錯誤。');
  return false;
}

async function purgeReviewImages(id){
  try{
    let rv = null;
    if(id === state.activeId && state.activeReview) rv = state.activeReview;
    else {
      const res = await storageAdapter.get('review:'+id, false);
      rv = JSON.parse(res.value);
    }
    for(const c of (rv.categories || [])){
      for(const it of (c.items || [])){
        for(const field of IMAGE_FIELDS){
          (Array.isArray(it[field]) ? it[field] : []).forEach(ref=>removeImageRef(ref));
        }
      }
    }
  }catch(e){ /* nothing to clean */ }
}

async function deleteReview(id){
  const wasActive = (id === state.activeId);
  const idx = state.reviewsList.findIndex(r=>r.id===id);
  await purgeReviewImages(id);
  try{ await storageAdapter.delete('review:'+id, false); }catch(e){}
  state.reviewsList = state.reviewsList.filter(r=>r.id!==id);
  await saveMeta();
  if(state.reviewsList.length===0){
    await createNewReview();
  } else if(wasActive){
    const next = state.reviewsList[Math.min(idx, state.reviewsList.length-1)];
    await loadReview(next.id);
  } else {
    render();
  }
}

async function requestDeleteTab(item){
  const label = tabLabel(item);
  const lockedNow = state.hasPassword && !state.editUnlocked;
  if(lockedNow && !verifyPasswordOnce()) return;
  const last = state.reviewsList.length === 1;
  const msg = '確定要刪除「'+label+'」這個分頁嗎？\n分頁內的所有內容與圖片都會被刪除，此動作無法復原。' + (last ? '\n（這是最後一個分頁，刪除後會自動建立一個空白審查。）' : '');
  if(!confirm(msg)) return;
  clearTimeout(saveTimer);
  if(item.id !== state.activeId) await saveActiveReview();
  await deleteReview(item.id);
}

function countStatus(review){
  let total=0, pass=0, fail=0, pending=0, na=0;
  review.categories.forEach(c=>c.items.forEach(it=>{
    total++;
    if(it.status==='pass') pass++;
    else if(it.status==='fail') fail++;
    else if(it.status==='na') na++;
    else pending++;
  }));
  return {total,pass,fail,pending,na};
}

function catCountStatus(cat){
  let total=cat.items.length, done=0;
  cat.items.forEach(it=>{ if(it.status!=='pending') done++; });
  return {total, done};
}

function ensureTemplateCategories(review){
  if(!Array.isArray(review.categories)) review.categories = [];
  let changed = false;
  Object.values(TEMPLATE_REGISTRY).forEach(tpl=>{
    const sample = tpl.fn();
    const existingCat = review.categories.find(c=>c.name === sample.name);
    if(!existingCat){
      review.categories.push(sample);
      changed = true;
      return;
    }
    const sampleByText = {};
    sample.items.forEach(si=>{ sampleByText[si.text] = si; });
    existingCat.items.forEach(it=>{
      const si = sampleByText[it.text];
      if(!si) return;
      if((!it.criteria || !it.criteria.trim()) && si.criteria){ it.criteria = si.criteria; changed = true; }
      if((!it.evidence || !it.evidence.trim()) && si.evidence){ it.evidence = si.evidence; changed = true; }
    });
    if(sample.fieldLabels){
      const merged = Object.assign({}, existingCat.fieldLabels||{}, sample.fieldLabels);
      if(JSON.stringify(merged) !== JSON.stringify(existingCat.fieldLabels||{})){
        existingCat.fieldLabels = merged;
        changed = true;
      }
    }
  });
  review._templatesChecked = true;
  return changed;
}

// ---- Image store (IndexedDB): 圖片以原始解析度存放，不塞進審查資料本體 ----
const IMG_DB_NAME = 'drc-images';
const IMG_STORE = 'images';
let imgDBPromise = null;
const imgUrlCache = {};

function openImgDB(){
  if(imgDBPromise) return imgDBPromise;
  imgDBPromise = new Promise((resolve, reject)=>{
    if(typeof indexedDB === 'undefined'){ reject(new Error('IndexedDB not available')); return; }
    const req = indexedDB.open(IMG_DB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IMG_STORE); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
  imgDBPromise.catch(()=>{ imgDBPromise = null; });
  return imgDBPromise;
}
async function idbPut(id, blob){
  const db = await openImgDB();
  return new Promise((res, rej)=>{
    const tx = db.transaction(IMG_STORE, 'readwrite');
    tx.objectStore(IMG_STORE).put(blob, id);
    tx.oncomplete = ()=>res();
    tx.onerror = ()=>rej(tx.error);
    tx.onabort = ()=>rej(tx.error);
  });
}
async function idbGet(id){
  const db = await openImgDB();
  return new Promise((res, rej)=>{
    const req = db.transaction(IMG_STORE, 'readonly').objectStore(IMG_STORE).get(id);
    req.onsuccess = ()=>res(req.result);
    req.onerror = ()=>rej(req.error);
  });
}
async function idbDelete(id){
  const db = await openImgDB();
  return new Promise((res, rej)=>{
    const tx = db.transaction(IMG_STORE, 'readwrite');
    tx.objectStore(IMG_STORE).delete(id);
    tx.oncomplete = ()=>res();
    tx.onerror = ()=>rej(tx.error);
  });
}
function isIdbRef(s){ return typeof s === 'string' && s.indexOf('idb:') === 0; }
function blobToDataURL(blob){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}
function dataURLToBlob(u){
  const parts = u.split(',');
  const mime = (parts[0].match(/:(.*?);/) || [])[1] || 'image/jpeg';
  const bin = atob(parts[1]);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type: mime});
}
async function resolveImageRef(ref){
  if(!isIdbRef(ref)) return ref;
  if(imgUrlCache[ref]) return imgUrlCache[ref];
  const blob = await idbGet(ref.slice(4));
  if(!blob) return '';
  const url = URL.createObjectURL(blob);
  imgUrlCache[ref] = url;
  return url;
}
function bindImgSrc(imgEl, ref){
  if(!isIdbRef(ref)){ imgEl.src = ref; return; }
  if(imgUrlCache[ref]){ imgEl.src = imgUrlCache[ref]; return; }
  resolveImageRef(ref).then(u=>{ if(u) imgEl.src = u; }).catch(()=>{});
}
function removeImageRef(ref){
  if(!isIdbRef(ref)) return;
  idbDelete(ref.slice(4)).catch(()=>{});
  if(imgUrlCache[ref]){ URL.revokeObjectURL(imgUrlCache[ref]); delete imgUrlCache[ref]; }
}
async function prepareImageBlob(file){
  // 6MB 以內直接存原檔(不重新壓縮，保留完整解析度)；超過才縮到長邊3200px、高畫質JPEG
  if(file.size <= 6 * 1024 * 1024) return file;
  const dataUrl = await compressImage(file, 3200, 0.92);
  return dataURLToBlob(dataUrl);
}
const IMAGE_FIELDS = ['images', 'issueImages'];

async function addImageToItem(it, file, field){
  field = field || 'images';
  if(!Array.isArray(it[field])) it[field] = [];
  try{
    const blob = await prepareImageBlob(file);
    const id = uid('img');
    await idbPut(id, blob);
    it[field].push('idb:' + id);
  }catch(err){
    console.warn('IndexedDB unavailable, falling back to inline image', err);
    const dataUrl = await compressImage(file, 2200, 0.88);
    it[field].push(dataUrl);
  }
  saveActiveReview(); render();
}

function buildImageGallery(it, field, canEdit, hint){
  if(!Array.isArray(it[field])) it[field] = [];
  const arr = it[field];
  const wrap = el('div',{class:'item-images'});
  arr.forEach((src, imgIdx)=>{
    const thumb = el('div',{class:'item-image-thumb'});
    const thumbImg = el('img',{onclick:()=>openLightbox(src)});
    bindImgSrc(thumbImg, src);
    thumb.appendChild(thumbImg);
    if(canEdit){
      thumb.appendChild(el('button',{class:'item-image-remove', title:'刪除圖片', onclick:(e)=>{
        e.stopPropagation();
        removeImageRef(src);
        arr.splice(imgIdx,1);
        saveActiveReview(); render();
      }},['×']));
    }
    wrap.appendChild(thumb);
  });
  if(canEdit){
    const fileInput = el('input',{type:'file', accept:'image/*', style:'display:none;', onchange:async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      try{
        await addImageToItem(it, file, field);
      }catch(err){
        console.error('image compress failed', err);
        alert('圖片處理失敗，請換一張試試。');
      }
      e.target.value = '';
    }});
    wrap.appendChild(el('div',{class:'item-image-add', title:hint, onclick:()=>fileInput.click()},['+ 新增圖片']));
    wrap.appendChild(fileInput);
  }
  return wrap;
}

async function migrateReviewImages(review){
  let changed = false;
  for(const c of (review.categories || [])){
    for(const it of (c.items || [])){
      for(const field of IMAGE_FIELDS){
        if(!Array.isArray(it[field])) continue;
        for(let i=0;i<it[field].length;i++){
          const ref = it[field][i];
          if(typeof ref === 'string' && ref.indexOf('data:') === 0){
            try{
              const id = uid('img');
              await idbPut(id, dataURLToBlob(ref));
              it[field][i] = 'idb:' + id;
              changed = true;
            }catch(e){ return changed; }
          }
        }
      }
    }
  }
  return changed;
}

async function exportBackup(review){
  try{
    const copy = JSON.parse(JSON.stringify(review));
    for(const c of (copy.categories || [])){
      for(const it of (c.items || [])){
        for(const field of IMAGE_FIELDS){
          if(!Array.isArray(it[field])) continue;
          const out = [];
          for(const ref of it[field]){
            if(isIdbRef(ref)){
              try{
                const blob = await idbGet(ref.slice(4));
                if(blob) out.push(await blobToDataURL(blob));
              }catch(e){ /* skip missing image */ }
            } else out.push(ref);
          }
          it[field] = out;
        }
      }
    }
    const payload = {
      exportedAt: new Date().toISOString(),
      reviewsList: state.reviewsList,
      review: copy
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const safeName = (review.name || '審查項目').replace(/[\\/:*?"<>|]/g,'_');
    a.href = url;
    a.download = safeName + '_備份.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){
    console.error('export failed', e);
    alert('匯出失敗，請稍後再試一次。');
  }
}

async function importBackup(file){
  try{
    const text = await file.text();
    const payload = JSON.parse(text);
    const review = payload.review || payload;
    if(!review || !Array.isArray(review.categories)){
      alert('這個檔案的格式看起來不對，無法匯入。');
      return;
    }
    const id = uid('rev');
    if(!Array.isArray(review.brainstorm)) review.brainstorm = [];
    await migrateReviewImages(review);
    state.reviewsList.push({id, name: (review.name||'匯入的審查') + '（匯入）', reviewer: review.reviewer || ''});
    review.name = (review.name||'匯入的審查') + '（匯入）';
    state.activeId = id;
    state.activeReview = review;
    await saveMeta();
    await saveActiveReview();
    render();
    alert('匯入成功！');
  }catch(e){
    console.error('import failed', e);
    alert('匯入失敗，請確認檔案是否為本系統匯出的備份檔。');
  }
}

async function handleItemPaste(e, it){
  if(!e.clipboardData || !e.clipboardData.items) return;
  const items = Array.from(e.clipboardData.items);
  const imageItem = items.find(i=>i.type && i.type.indexOf('image/')===0);
  if(!imageItem) return;
  const inIssue = !!(e.target && e.target.closest && e.target.closest('.item-issue'));
  const field = inIssue ? 'issueImages' : 'images';
  const lockedNow = state.hasPassword && !state.editUnlocked;
  if(field === 'images' && lockedNow) return;
  e.preventDefault();
  const file = imageItem.getAsFile();
  if(!file) return;
  try{
    await addImageToItem(it, file, field);
  }catch(err){
    console.error('paste image failed', err);
    alert('貼上圖片失敗，請改用「+ 新增圖片」按鈕試試。');
  }
}

function compressImage(file, maxDim, quality){
  maxDim = maxDim || 1800; quality = quality || 0.85;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function el(tag, attrs, children){
  const e = document.createElement(tag);
  if(attrs) Object.entries(attrs).forEach(([k,v])=>{
    if(k==='class') e.className=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if(v!==undefined && v!==null) e.setAttribute(k,v);
  });
  (children||[]).forEach(c=>{
    if(typeof c === 'string') e.appendChild(document.createTextNode(c));
    else if(c) e.appendChild(c);
  });
  return e;
}

function itemMatchesFilter(it){
  if(state.filterStatus === 'issue'){
    if(!((it.issue && it.issue.trim()) || (Array.isArray(it.issueImages) && it.issueImages.length))) return false;
  } else if(state.filterStatus !== 'all' && it.status !== state.filterStatus) return false;
  const q = (state.searchText || '').trim().toLowerCase();
  if(q){
    const hay = ((it.text||'') + ' ' + (it.criteria||'') + ' ' + (it.evidence||'') + ' ' + (it.issue||'')).toLowerCase();
    if(hay.indexOf(q) === -1) return false;
  }
  return true;
}

function resizeVisibleTextareas(){
  document.querySelectorAll('.item-text, .meta-textarea').forEach(t=>{
    if(t.offsetParent === null) return;
    t.style.height = 'auto';
    t.style.height = t.scrollHeight + 'px';
  });
}

function applyFilters(){
  const r = state.activeReview;
  const app = document.getElementById('app');
  if(!r || !app) return;
  const filtering = state.filterStatus !== 'all' || (state.searchText || '').trim() !== '';
  app.classList.toggle('filtering', filtering);
  const byId = {};
  r.categories.forEach(c=>c.items.forEach(it=>{ byId[it.id] = it; }));
  let visibleTotal = 0;
  document.querySelectorAll('.category').forEach(catEl=>{
    let vis = 0;
    catEl.querySelectorAll('[data-iid]').forEach(row=>{
      const it = byId[row.getAttribute('data-iid')];
      const show = !it || itemMatchesFilter(it);
      row.style.display = show ? '' : 'none';
      if(show) vis++;
    });
    catEl.style.display = (filtering && vis === 0) ? 'none' : '';
    visibleTotal += vis;
  });
  const none = document.getElementById('noResult');
  if(none) none.style.display = (filtering && visibleTotal === 0) ? 'block' : 'none';
  resizeVisibleTextareas();
}

          saveActiveReview(); render();
        }});
        bulkMoveSelect.appendChild(el('option',{value:''},['移動到…']));
        r.categories.forEach(c=>{
          if(c.id===cat.id) return;
          bulkMoveSelect.appendChild(el('option',{value:c.id},[c.name]));
        });
        table.appendChild(el('div',{class:'bulk-row', 'data-iid':it.id, 'data-status':it.status},[
          el('div',{class:'bulk-cell bulk-num'},[(catIdx+1)+'.'+(itIdx+1)]),
          el('div',{class:'bulk-cell bulk-text'},[
            el('textarea',{class:'bulk-input bulk-textarea', rows:'1', placeholder:'審查項目描述', value:it.text, disabled: locked ? 'disabled' : null, oninput:(e)=>{ it.text=e.target.value; scheduleSave(); }, onblur:()=>saveActiveReview()})
          ]),
          el('div',{class:'bulk-cell bulk-crit'},[
            el('input',{class:'bulk-input', type:'text', value:it.criteria, disabled: locked ? 'disabled' : null, oninput:(e)=>{ it.criteria=e.target.value; scheduleSave(); }, onblur:()=>saveActiveReview()})
          ]),
          el('div',{class:'bulk-cell bulk-evid'},[
            el('input',{class:'bulk-input', type:'text', value:it.evidence, oninput:(e)=>{ it.evidence=e.target.value; scheduleSave(); }, onblur:()=>saveActiveReview()})
          ]),
          el('div',{class:'bulk-cell bulk-status'},[statusSelect]),
          el('div',{class:'bulk-cell bulk-move'},[locked ? '' : bulkMoveSelect]),
          el('div',{class:'bulk-cell bulk-del'}, locked ? [] : [
            el('div',{style:'display:flex;gap:2px;'},[
              el('button',{class:'item-reorder-btn', title:'往上移動', onclick:()=>{
                if(itIdx>0){
                  const tmp = cat.items[itIdx-1];
                  cat.items[itIdx-1] = cat.items[itIdx];
                  cat.items[itIdx] = tmp;
                  saveActiveReview(); render();
                }
              }},['▲']),
              el('button',{class:'item-reorder-btn', title:'往下移動', onclick:()=>{
                if(itIdx<cat.items.length-1){
                  const tmp = cat.items[itIdx+1];
                  cat.items[itIdx+1] = cat.items[itIdx];
                  cat.items[itIdx] = tmp;
                  saveActiveReview(); render();
                }
              }},['▼'])
            ]),
            el('button',{class:'small danger-ghost', onclick:()=>{ cat.items.splice(itIdx,1); saveActiveReview(); render(); }},['×'])
          ])
        ]));
      });
      body.appendChild(table);
      if(!locked){
        const addRowBtn = el('button',{class:'small add-item-btn', onclick:()=>{
          cat.items.push({id:uid('it'), text:'', criteria:'', evidence:'', owner:'', status:'pending'});
          saveActiveReview(); render();
        }},['+ 新增列']);
        body.appendChild(addRowBtn);
      }
    } else {
      cat.items.forEach((it, itIdx)=>{
      const row = el('div',{class:'item-row', 'data-iid':it.id, 'data-status':it.status, onpaste:(e)=>handleItemPaste(e, it)});
      const top = el('div',{class:'item-top'});
      top.appendChild(el('div',{class:'item-num'},[(catIdx+1)+'.'+(itIdx+1)]));

      const main = el('div',{class:'item-main'});
      const textArea = el('textarea',{class:'item-text', rows:'1', placeholder:'審查項目描述', 'data-item-id':it.id, disabled: locked ? 'disabled' : null, oninput:(e)=>{
        it.text = e.target.value;
        e.target.style.height='auto'; e.target.style.height=e.target.scrollHeight+'px';
        scheduleSave();
      }, onblur:()=>saveActiveReview()});
      textArea.value = it.text;
      const statusSeg = el('div',{class:'status-seg'});
      STATUS.forEach(st=>{
        statusSeg.appendChild(el('button',{class:'status-btn'+(it.status===st?' active':''), 'data-s':st, onclick:()=>{ it.status=st; saveActiveReview(); render(); }},[STATUS_LABEL[st]]));
      });
      main.appendChild(el('div',{class:'item-head'},[textArea, statusSeg]));

      const meta = el('div',{class:'item-meta'});
      function metaField(labelText, val, ph, onInput, fieldLocked){
        const f = el('div',{class:'field'});
        f.appendChild(el('label',{},[labelText]));
        const input = el('textarea',{class:'meta-textarea', rows:'1', placeholder:ph, disabled: fieldLocked ? 'disabled' : null, oninput:(e)=>{
          onInput(e.target.value);
          e.target.style.height='auto'; e.target.style.height=e.target.scrollHeight+'px';
          scheduleSave();
        }, onblur:()=>saveActiveReview()});
        input.value = val;
        f.appendChild(input);
        return f;
      }
      const labels = cat.fieldLabels || {criteria:'通過基準', evidence:'備註'};
      meta.appendChild(metaField(labels.criteria, it.criteria, '', v=>it.criteria=v, locked));
      meta.appendChild(metaField(labels.evidence, it.evidence, '', v=>it.evidence=v, false));
      main.appendChild(meta);

      if(!Array.isArray(it.images)) it.images = [];
      if(!locked || it.images.length>0){
        main.appendChild(buildImageGallery(it, 'images', !locked, '點擊上傳，或在這個項目裡按 Ctrl+V／Cmd+V 貼上截圖'));
      }

      // ---- Issue 描述（鎖定時也可填寫，像備註一樣屬於填寫內容）----
      if(!Array.isArray(it.issueImages)) it.issueImages = [];
      const hasIssue = !!((it.issue && it.issue.trim()) || it.issueImages.length);
      if(hasIssue || state.issueOpen[it.id]){
        const issueBox = el('div',{class:'item-issue'+(hasIssue ? ' has-issue' : ''), tabindex:'0'});
        issueBox.appendChild(el('label',{},['Issue 描述']));
        const issueTa = el('textarea',{class:'meta-textarea issue-textarea', rows:'1', 'data-issue-for':it.id, placeholder:'描述問題；可直接按 Ctrl+V 貼上截圖', oninput:(e)=>{
          it.issue = e.target.value;
          e.target.style.height='auto'; e.target.style.height=e.target.scrollHeight+'px';
          scheduleSave();
        }, onblur:()=>saveActiveReview()});
        issueTa.value = it.issue || '';
        issueBox.appendChild(issueTa);
        issueBox.appendChild(buildImageGallery(it, 'issueImages', true, '點擊上傳，或在 Issue 區按 Ctrl+V／Cmd+V 貼上截圖'));
        main.appendChild(issueBox);
      } else {
        main.appendChild(el('button',{class:'small issue-open-btn', onclick:()=>{
          state.issueOpen[it.id] = true;
          state.focusIssueId = it.id;
          render();
        }},['+ Issue 描述 / 貼圖']));
      }

      if(!locked){
        const actions = el('div',{class:'item-actions'});
        if(r.categories.length > 1){
          const moveSelect = el('select',{class:'move-select', onchange:(e)=>{
            const targetId = e.target.value;
            if(!targetId) return;
            const targetCat = r.categories.find(c=>c.id===targetId);
            if(!targetCat) return;
            cat.items.splice(itIdx,1);
            targetCat.items.push(it);
            saveActiveReview(); render();
          }});
          moveSelect.appendChild(el('option',{value:''},['移動到…']));
          r.categories.forEach(c=>{
            if(c.id===cat.id) return;
            moveSelect.appendChild(el('option',{value:c.id},[c.name]));
          });
          actions.appendChild(moveSelect);
        }
        actions.appendChild(el('button',{class:'small danger-ghost', onclick:()=>{ cat.items.splice(itIdx,1); saveActiveReview(); render(); }},['刪除項目']));
        main.appendChild(actions);
      }

      top.appendChild(main);
      if(!locked){
        const itemReorder = el('div',{class:'item-reorder'},[
          el('button',{class:'item-reorder-btn', title:'項目往上移動', onclick:()=>{
            if(itIdx>0){
              const tmp = cat.items[itIdx-1];
              cat.items[itIdx-1] = cat.items[itIdx];
              cat.items[itIdx] = tmp;
              saveActiveReview(); render();
            }
          }},['▲']),
          el('button',{class:'item-reorder-btn', title:'項目往下移動', onclick:()=>{
            if(itIdx<cat.items.length-1){
              const tmp = cat.items[itIdx+1];
              cat.items[itIdx+1] = cat.items[itIdx];
              cat.items[itIdx] = tmp;
              saveActiveReview(); render();
            }
          }},['▼'])
        ]);
        top.appendChild(itemReorder);
      }
      row.appendChild(top);
      body.appendChild(row);
      });

      if(!locked){
        const addItemBtn = el('button',{class:'small add-item-btn', onclick:()=>{
          cat.items.push({id:uid('it'), text:'', criteria:'', evidence:'', owner:'', status:'pending'});
          saveActiveReview(); render();
        }},['+ 新增審查項目']);
        body.appendChild(addItemBtn);
      }
    }

    catEl.appendChild(body);
    app.appendChild(catEl);
  });

  if(!locked){
    const addCatPanel = el('div',{class:'signoff', style:'margin-bottom:16px;'});
    addCatPanel.appendChild(el('h2',{},['新增分類']));
    const addCatRow = el('div',{style:'display:flex;gap:10px;flex-wrap:wrap;align-items:center;'},[
      el('button',{onclick:()=>{
        const name = prompt('新分類名稱（例：安規／EMC）');
        if(name && name.trim()){
          r.categories.push({id:uid('cat'), name:name.trim(), items:[]});
          saveActiveReview(); render();
        }
      }},['+ 自訂分類'])
    ]);
    const templateSelect = el('select',{class:'review-select', style:'min-width:220px;'});
    Object.entries(TEMPLATE_REGISTRY).forEach(([key,tpl])=>{
      templateSelect.appendChild(el('option',{value:key},[tpl.label]));
    });
    addCatRow.appendChild(templateSelect);
    addCatRow.appendChild(el('button',{class:'primary', onclick:()=>{
      const key = templateSelect.value;
      const tpl = TEMPLATE_REGISTRY[key];
      if(!tpl) return;
      if(confirm('加入「'+tpl.label+'」範本分類，會新增為獨立分類，不影響現有內容？')){
        r.categories.push(tpl.fn());
        saveActiveReview(); render();
      }
    }},['+ 加入範本分類']));
    addCatPanel.appendChild(addCatRow);
    app.appendChild(addCatPanel);
  }

  applyFilters();

  if(state.focusIssueId){
    const ita = document.querySelector('.issue-textarea[data-issue-for="'+state.focusIssueId+'"]');
    if(ita) ita.focus();
    state.focusIssueId = null;
  }

  const focusItem = r.categories.flatMap(c=>c.items).find(i=>i._focus);
  if(focusItem){
    delete focusItem._focus;
    const ta = document.querySelector('textarea[data-item-id="'+focusItem.id+'"]');
    if(ta) ta.focus();
  }
}

document.getElementById('importFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(file) importBackup(file);
  e.target.value = '';
});
document.addEventListener('click', (e)=>{
  if(state.menuOpen && !(e.target.closest && e.target.closest('.menu-wrap'))){
    state.menuOpen = false;
    render();
  }
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape' && state.menuOpen){ state.menuOpen = false; render(); }
});

loadAll();
</script>
</body>
</html>
